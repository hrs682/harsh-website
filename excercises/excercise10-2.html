<!DOCTYPE html>
<html>
    <head>
        <style>
            p {
                font-family: Arial;
                margin-top: 0px;
                margin-bottom: 0px;
            }

            .profile {
                width: 450px;
                height: 120px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 5px;
            }

            .profile-picture{
                width: 100px;
                height: 100px;
                margin-top: 5px;
                object-fit: cover;
                margin-left: 5px;
                background-color:red;
                display: inline-block;
                border-radius: 200px;
            }

            .name {
                margin-bottom: 5px;
                font-weight: 700;
                font-size: 18px;
                display: block;
            }

            .second-line {
                margin-bottom: 2px;
                color: gray;
            }

            .third-line {
                color: gray;
            }

            .follow-button {
                font-weight: 600;
                color: white;
                font-size: 18px;
                width: 100px;
                height: 35px;
                background-color:rgb(14, 133, 237);
                margin-left: auto;
                margin-right: 10px;
                border-radius: 4px;
                border: none;
            }

            .follow-button:hover {
                background-color: rgb(49, 189, 244);
                cursor: pointer;
            }

            .profile-2 {
                width: 450px;
                height: 120px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 5px;
            }

            .profile-picture-2 {
                width: 100px;
                height: 100px;
                object-fit: cover;
                display: inline-block;
                margin-top: 3px;
                border-radius: 200px;
                margin-left: 5px;
            }

            .name-2 {
                margin-bottom: 5px;
                font-weight: bold;
            }

            .fourth-line {
                margin-bottom: 2px;
                color: gray;
            }

            .fifth-line {
                color: gray;
            }

            .follow-button-2 {
                font-weight: 600;
                font-size: 18px;
                width: 100px;
                height: 35px;
                border-radius: 4px;
                margin-left: auto;
                margin-right: 10px;
                color: white;
                background-color: rgb(14, 133, 237);
                border: none;
            }

            .follow-button-2:hover {
                cursor: pointer;
                background-color: rgb(49, 189, 244);
            }

            .profile-3 {
                width: 450px;
                height: 120px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                gap: 15px;
            }

            .profile-picture-3 {
                width: 100px;
                height: 100px;
                object-fit: cover;
                display: inline-block;
                border-radius: 200px;
                margin-left: 5px;
            }
             

            .name-3 {
                margin-bottom: 5px;
                font-weight: bold;
            }

            .sixth-line {
                margin-bottom: 2px;
                color: gray;
            
            }

            .seventh-line {
                color: gray;
            }

            .follow-button-3 {
                font-weight: 600;
                font-size: 18px;
                width: 100px;
                height: 35px;
                border: none;
                border-radius: 4px;
                background-color: rgb(14, 133, 237);
                color: white;
                margin-left: auto;
                margin-right: 10px;
            }

            .follow-button-3:hover {
                cursor: pointer;
                background-color: rgb(49, 189, 244);
            }
        </style>
    </head>
    <body>
        <div>
            <div class="profile"><img class="profile-picture" src="/channel-pictures/cat.jpg">
               <div>
                 <p class="name">oliver</p>
                 <p class="second-line">the cat</p>
                 <p class="third-line">popular</p>
               </div>
               <button class="follow-button">Follow</button>
            </div>
            <div class="profile-2"><img class="profile-picture-2" src="/channel-pictures/cat2.jpg">
                <div>
                     <p class="name-2">Mimi</p>
                     <p class="fourth-line">Sleepy Cat</p>
                     <p class="fifth-line">popular</p>
                </div>
                <button class="follow-button-2">Follow</button>
             </div>
                <div class="profile-3"><img class="profile-picture-3" src="/channel-pictures/dog.jpg">
                    <div>
                     <p class="name-3">Rex</p>
                     <p class="sixth-line">Happy Bulldog</p>
                     <p class="seventh-line">popular</p>
                    </div>
                    <button class="follow-button-3">Follow</button>
                </div> 
         </div>
    </body>
</html>
