<!DOCTYPE html>
<html>
<head>
    <style>
        p {
            font-family: arial;
            margin-top: 0;
            margin-bottom: 0;
        }

        .profile {
            width: 350px;
            height: 100px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            display: inline-block;
            display: flex;
            align-items: center;
            margin-right: 15px;
        }

        .profile-picture {
            width: 60px;
            height: 60px;
            border-radius: 200px;
            object-fit: cover;
            background-color: gray;
            margin-left: 6px;
        }

        .text-container {
            padding-left: 10px;
            flex: 1;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .second-line {
            font-size: 14px;
            color: gray;
            margin-bottom: 2px;
        }

        .third-line {
            font-size: 14px;
            color: gray;
        }

        .follow-button {
            width: 90px;
            height: 30px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin-left: auto;
            background-color: rgb(14, 133, 237);
            margin-right: 10px;
            border-radius: 4px;
            border: none;
        }

        .follow-button:hover {
            background-color: rgb(114, 189, 255);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile">
        <img class="profile-picture" src="/channel-pictures/cat.jpg">
        <div class="text-container">
            <div><p class="name">oliver</p></div>
            <div><p class="second-line">the cat</p></div>
            <div><p class="third-line">popular</p></div>
        </div>
            <div><button class="follow-button">Follow</button></div>
    </div>
</body>
</html>
