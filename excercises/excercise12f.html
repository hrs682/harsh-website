<!DOCTYPE html>
<html>
<head>
    <title> flexbox excercise</title>

    <style>

        div {
            font-family: arial;
        }


        .header {
            background-color: rgb(120, 80, 178);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding-left: 15px;
            padding-right: 15px;
            
        }

        .left-section {
            color: white;
            font-weight: bold;
            
        }

        .text-box {
            width: 500px;
            border: none;
            height: 30px;
            margin-top: 12px;
            margin-bottom: 12px;
            border-radius: 15px;
            padding-left: 20px;
        }

        .Download-1 {
            background-color: rgb(120, 80, 178);
            border-color: white;
            border-style: solid;
            border-width: 1px;
            color: white;
            border-radius: 2px;
            padding-bottom: 8px;
            padding-top: 8px;
            padding-right: 15px;
            padding-left: 15px;

        }

    </style>
</head>
<body>
   <div class="header">
    <div class="left-section">Home</div>
    <input class="text-box" placeholder="search">
    <button class="Download-1">Download</button>
   </div> 
</body>
</html>
