<!DOCTYPE html>
<html>
    <head>
        <title>Excercise-d</title>

        <style>
            p {
            font-family: arial;
            margin-top: 0;
            margin-bottom: 0;
            }

            .grid {
                display: grid;
                grid-template-columns: 200px 200px 200px;
                column-gap: 20px;
            }

            .profile {
                width: 200px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                vertical-align: top;
            }

            .profile-picture {
                width: 200px;
                height: 200px;
                object-fit: cover;
                margin-bottom: 12px;
            }
             
            .name {
                font-size:18px;
                font-weight: 600;
                margin-left: 8px;
                margin-bottom: 5px;
            }

            .mutual-frnds-row {
                display: grid;
                grid-template-columns: 35px 1fr;
                align-items: center;
                margin-left: 8px;
                margin-bottom: 10px;
            }

            .mutual-friend-picture {
                width: 28px;
                height: 28px;
                object-fit: cover;
                border-radius: 14px;
                vertical-align: middle;
                margin-right: 4px;
            }

            .mutual-friends {
                color: gray;
                font-size: 15px;
            }

            .add-friend-button {
                color: white;
                width: 120px;
                height: 35px;
                background-color: rgb(24, 119, 242);    
                border: none;
                border-radius: 4px;
                margin-bottom: 10px;
                margin-left: 8px;
                font-size: 16px;
            }

        </style>
    </head>
    <body>
        <div class="grid">
            <div class="profile">
                <img class="profile-picture" src="/channel-pictures/cat.jpg">
                <p class="name">Oliver</p>

            <div class="mutual-frnds-row">
                <img class="mutual-friend-picture" src="/channel-pictures/dog2.jpg">
                <p class="mutual-friends">
                    2 Mutual Friends
                </p>
            </div>
            <button class="add-friend-button">
                Add Friend
            </button>
         </div>

         <div class="profile">
            <img class="profile-picture" src="/channel-pictures/cat2.jpg">
            <p class="name"> Mimi</p>
            <div class="mutual-frnds-row">
                <img class="mutual-friend-picture" src="/channel-pictures/dog2.jpg">
                <p class="mutual-friends">3 Mutual Friends</p>
            </div>
            <button class="add-friend-button">
                Add Friend 
            </button>
         </div>

         <div class="profile">
            <img class="profile-picture" src="/channel-pictures/dog.jpg">
            <p class="name">Rex</p>
            <div class="mutual-frnds-row">
                <img class="mutual-friend-picture" src="/channel-pictures/dog2.jpg">
                <p class="mutual-friends">4 Mutual Friends</p>
            </div>
            <button class="add-friend-button">
                Add Friend
            </button>
         </div>
        </div>
    </body>
</html>
