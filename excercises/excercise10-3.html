<!DOCTYPE html>
<html>
    <head>
        <style>

            p {
                font-family: arial;
                margin-top: 0;
                margin-bottom: 0;
            }
            
            .profile {
                width: 250px;
                height: 380px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
                margin-right: 8px;
            }


            .profile-picture {
                width: 250px;
                height: 250px;
                object-fit: cover;
            }


            .mutual-profile {
                width: 30px;
                height: 30px;
                object-fit: cover;
                border-radius: 50px;
            }

            .oliver-name {
                margin-top: 4px;
                margin-left: 5px;
                font-size: 18px;
                font-weight: bold;
                margin-bottom: 4px;
            }

            .mutual-frnds {
                display: inline-block; 
                margin-left: 8px;
                font-size: 16px;
                color: gray;
            }
            
            .profile-2 {
                display: flex;
                align-items: center;
                margin-left: 5px;
            }

            .button  {
                font-size: 15px;
                font-weight: 500;
                width: 120px;
                height: 35px;
                margin-top: 18px;
                margin-left: 10px;
                display: inline-block;
                background-color:  rgb(14, 133, 237);
                color: white;
                border: none;
                border-radius: 4px;

            }

            .button:hover {
                cursor: pointer;
            }

            .container {
                display: flex;
            }

            .pfp-2 {
                width: 250px;
                height: 250px;
                object-fit: cover;
            }

            .profile-3 {
                width: 250px;
                height: 380px;
                display: flex;
                flex-direction: column;
               box-shadow: 0 0 5px rgba(0,0,0,0.3);
               margin-right: 8px;
            }

            .mimi-name {
                margin-top: 5px;
                margin-left: 4px;
                font-weight: 600;
                font-size: 18px;
                margin-bottom: 4px;
            }

            .profile-5 {
                display: flex;
                align-items: center;
            }

            .mutual-profile2 {
                width: 30px;
                height: 30px;
                border-radius: 50px;
                object-fit: cover;
                margin-left: 5px;
            }

            .mutual-frnds2 {
                display: inline-block;
                margin-left: 8px;
                color: gray;
            }

            .button-2 {
                width: 120px;
                height: 35px;
                font-size: 15px;
                font-weight: 500;
                margin-top: 18px;
                margin-left: 10px;
                border: none;
                border-radius: 4px;
                background-color:rgb(14, 133, 237);
                color: white;
            }

            .button-2:hover {
                cursor: pointer;
            }

            .profile-6 {
                width: 250px;
                height: 380px;
                box-shadow: 0 0 5px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
            }

            .mutual-profile3 {
                height: 250px;
                width: 250px;
                object-fit: cover;
            }

            .rex-name {
                font-size: 18px;
                margin-top: 4px;
                margin-bottom: 4px;
                margin-left: 5px;
                font-weight: 600;
            }

            .profile-8 {
                display: flex;
                align-items: center;
            }

            .mutual-profile4 {
                width: 30px;
                height: 30px;
                object-fit: cover;
                border-radius: 50px;
                margin-left: 5px;
            }
             .mutual-frnds3 {
                display: inline-block;
                margin-left: 8px;
                color: gray;
             }

             .button-3 {
                font-size: 15px;
                font-weight: 500;
                margin-top: 18px;
                margin-left: 10px;
                width: 120px;
                height: 35px;
                border-radius: 4px;
                border: none;
                background-color: rgb(14, 133, 237);
                color: white;
             }

             .button-3:hover {
                cursor: pointer;
             }
        </style>
    </head>
    <body>
       <div class="container">
             <div class="profile">
            <img class="profile-picture" src="/channel-pictures/cat.jpg">
            <div>
                <p class="oliver-name">oliver</p>
            </div>
            <div class="profile-2">
                 <img class="mutual-profile" src="/channel-pictures/dog2.jpg">
                 <p class="mutual-frnds">2 mutual friends</p>
            </div>
            <button class="button">Add Friend</button>
        </div>

        <div class="profile-3">
            <img class="pfp-2" src="/channel-pictures/cat2.jpg">
            <div class="profile-4">
                <p class="mimi-name">Mimi</p>
            </div>
            <div class="profile-5">
            <img class="mutual-profile2" src="/channel-pictures/dog2.jpg">
            <p class="mutual-frnds2">3 Mutual friends</p>
            </div>
            <button class="button-2">Add Friend</button>
        </div>

        <div class="profile-6">
            <img class="mutual-profile3" src="/channel-pictures/dog.jpg">
            <div class="profile-7">
                <p class="rex-name">Rex</p>
            </div>
            <div class="profile-8">
                <img class="mutual-profile4" src="/channel-pictures/dog2.jpg">
                <p class="mutual-frnds3">4 Mutual friends</p>
            </div>
            <button class="button-3">Add Friend</button>
        </div>
       </div>
    </body>
</html>
